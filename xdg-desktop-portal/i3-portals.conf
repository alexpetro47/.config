# i3 has no portal backend of its own, so xdg-desktop-portal never picks one
# for Settings (it only falls back for other interfaces). Without Settings,
# Brave/Chromium can't read org.freedesktop.appearance color-scheme, so the
# gsettings flip in toggle-theme never reaches the browser.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gtk
