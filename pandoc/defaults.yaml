# PANDOC DEFAULTS

# lists_without_preceding_blankline: a "- item" run directly under a **heading**
# line is a real list, not a lazy paragraph continuation (GFM behaviour)
reader: markdown+hard_line_breaks+strikeout+task_lists+smart+raw_tex+lists_without_preceding_blankline
writer: pdf

standalone: true
pdf-engine: xelatex

wrap: preserve
columns: 72

filters:
  - /home/alexpetro/.config/pandoc/newpage-filter.lua
  - /home/alexpetro/.config/pandoc/highlight-filter.lua
  # drop this line to keep literal -> and => in prose
  - /home/alexpetro/.config/pandoc/arrows-filter.lua
  # - mermaid-filter

highlight-style: tango

metadata:
  # mermaidFilter:
  #   theme: dark
  #   width: 1200
  #   format: svg
  #   background: transparent
  geometry: margin=1.1in
  fontsize: 11pt
  documentclass: article
  papersize: letter
  colorlinks: true
  linkcolor: blue
  urlcolor: blue
  mainfont: "Bitstream Charter"
  sansfont: "TeX Gyre Heros"
  monofont: "DejaVu Sans Mono"
  pagestyle: plain
  listings: true

variables:
  geometry: margin=1.1in
  fontsize: 11pt

include-in-header:
  - /home/alexpetro/.config/pandoc/highlight-header.tex
