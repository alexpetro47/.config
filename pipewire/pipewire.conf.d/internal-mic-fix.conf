# Internal mic fix: ThinkPad P14s Gen 6 AMD digital mic (ACP PDM, card acppdmmach)
#
# The raw DMIC arrives ~25-30 dB too quiet (speech at -45..-50 dBFS) with a large
# DC offset on the left channel (~7% of full scale), and the card exposes no ALSA
# gain controls. Raising the source volume alone would clip the offset channel, so
# this virtual source high-passes each channel (a biquad highpass has a zero at DC)
# and then adds +18 dB (two +9 dB mixer stages; mixer gain is range-limited).
# +24 dB measured 0.5% clipping on normal speech; +18 dB lands speech at ~-24 dBFS.
#
# Result: "Internal Mic (boosted)" Audio/Source. priority.session 2005 puts it
# above the raw ALSA mics (2000) but below Bluetooth headset mics (2010), so it is
# the default input on its own and AirPods HFP still takes over when switched in.
#
# Tune: change both "Gain 1" values (2.818 = +9 dB each, 3.98 = +12 dB each).
# Loaded by the pipewire daemon from $XDG_CONFIG_HOME/pipewire/pipewire.conf.d/;
# apply with
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# On a machine without this DMIC the capture side falls back to the default source.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal Mic (boosted)"
      media.name       = "Internal Mic (boosted)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_highpass name = hp control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin label = mixer name = gain1 control = { "Gain 1" = 2.818 } }
          { type = builtin label = mixer name = gain2 control = { "Gain 1" = 2.818 } }
        ]
        links = [
          { output = "hp:Out"    input = "gain1:In 1" }
          { output = "gain1:Out" input = "gain2:In 1" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name     = "capture.internal_mic_fix"
        node.passive  = true
        target.object = "alsa_input.pci-0000_c4_00.6.HiFi__hw_acppdmmach__source"
      }
      playback.props = {
        node.name        = "internal_mic_fix"
        media.class      = Audio/Source
        priority.session = 2005
      }
    }
  }
]
